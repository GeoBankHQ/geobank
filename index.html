<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="description" content="GeoBank — გამოგონილი სასწავლო პროექტი." />
  <title>GeoBank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;
      --ink:#09090d;
      --red:#df1e35;
      --red2:#ff445a;
      --soft:#f8f2f4;
      --card:#101012;
      font-family:'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow-x:hidden;
      color:var(--ink);
      background:#f8f4f5;
    }
    .background{
      position:fixed; inset:-18%; pointer-events:none; overflow:hidden;
      background:
        radial-gradient(circle at 14% 18%, rgba(255,255,255,0.92) 0 18%, rgba(255,255,255,0) 46%),
        radial-gradient(circle at 83% 16%, rgba(255,73,103,0.28) 0 14%, rgba(255,73,103,0) 36%),
        radial-gradient(circle at 22% 78%, rgba(20,20,26,0.11) 0 14%, rgba(20,20,26,0) 33%),
        radial-gradient(circle at 86% 82%, rgba(233,38,66,0.18) 0 12%, rgba(233,38,66,0) 28%),
        linear-gradient(135deg,#fffdfd 0%, #fff9fa 30%, #fdecef 58%, #f9f4f5 100%);
      animation:bgShift 14s ease-in-out infinite alternate;
    }
    .mesh, .mesh2, .mesh3{
      position:absolute;border-radius:50%;filter:blur(75px);opacity:.62;mix-blend-mode:multiply;
      animation:float 14s ease-in-out infinite alternate;
    }
    .mesh{width:42vmax;height:42vmax;background:rgba(255,72,92,.18);top:-8%;right:-10%}
    .mesh2{width:32vmax;height:32vmax;background:rgba(20,20,20,.12);left:-10%;bottom:-13%;animation-delay:-6s}
    .mesh3{width:26vmax;height:26vmax;background:rgba(255,255,255,.85);left:30%;top:7%;filter:blur(52px);animation-delay:-2s}
    .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(50,50,60,.18) .8px, transparent .8px);background-size:26px 26px;opacity:.18}

    main{
      position:relative;z-index:2;
      width:min(92vw, 880px);
      padding:42px 20px 34px;
      display:flex;flex-direction:column;align-items:center;gap:18px;
      animation:fadeUp .8s cubic-bezier(.21,.84,.24,1) both;
    }
    .logo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
    .logo-wrap img{
      width:min(250px,52vw); height:auto; display:block;
      filter:drop-shadow(0 10px 24px rgba(222,30,53,.14));
    }
    h1{
      margin:0;
      font-size:clamp(44px,7vw,76px);
      line-height:1;
      font-weight:700;
      letter-spacing:-0.055em;
      color:#0d0d10;
    }
    .video-card{
      margin-top:8px;
      width:min(92vw, 760px);
      aspect-ratio:16/9;
      border-radius:30px;
      position:relative;
      background:linear-gradient(180deg,#0f1014 0%, #020203 100%);
      box-shadow:0 28px 70px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.06);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
    }
    .video-card::before{
      content:"";
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 70% 18%, rgba(228,34,56,.18), transparent 18%),
        radial-gradient(circle at 28% 76%, rgba(255,255,255,.08), transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0));
    }
    .play-btn{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:94px;
      height:94px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.23);
      padding:0;
      cursor:pointer;
      background:linear-gradient(145deg,#ff4b60 0%,#e81637 75%,#c70e29 100%);
      box-shadow:0 0 0 10px rgba(235,28,54,.08), 0 18px 45px rgba(225,16,51,.36), inset 0 1px 0 rgba(255,255,255,.3);
      transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, filter .28s ease;
    }
    .play-btn:hover{
      transform:translate(-50%, -50%) scale(1.075);
      box-shadow:0 0 0 14px rgba(235,28,54,.1), 0 23px 55px rgba(225,16,51,.46), inset 0 1px 0 rgba(255,255,255,.4);
      filter:brightness(1.05);
    }
    .play-btn:active{transform:translate(-50%, -50%) scale(.96)}
    .play-btn:focus-visible{outline:3px solid #fff;outline-offset:6px}
    .play-btn svg{
      width:32px;
      height:32px;
      display:block;
      fill:#fff;
      transform:none;
    }
    @keyframes float{to{transform:translate(4%,-3%) scale(1.08)}}
    @keyframes bgShift{to{transform:translate3d(1.4%,-1%,0) scale(1.03)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @media (max-width:560px){
      main{padding-top:34px;gap:14px}
      .play-btn{width:76px;height:76px}
      .play-btn svg{width:27px;height:27px}
      .video-card{border-radius:24px}
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="mesh"></div>
    <div class="mesh2"></div>
    <div class="mesh3"></div>
    <div class="grid"></div>
  </div>

  <main>
    <div class="logo-wrap">
      <img src="assets/geobank-logo.png" alt="GeoBank logo" />
      <h1>GeoBank</h1>
    </div>

    <div class="video-card" aria-label="ვიდეო ზონა">
      <button class="play-btn" id="playRickroll" aria-label="ვიდეოს გაშვება">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.3 5.8L19.4 12L8.3 18.2Z"/></svg>
      </button>
    </div>

  </main>

  <script>
    document.getElementById('playRickroll').addEventListener('click', function(){
      window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
    });
  </script>
</body>
</html>
